Name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Catatan: Step 'Setup Android SDK' bawaan diganti/dihapus karena 
      # runner ubuntu-latest sudah punya Android SDK & Cmdline-tools bawaan.

      - name: Build with Gradle
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=\"-Xmx3072m -XX:MaxMetaspaceSize=512m\""
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            -x test \
            -x lint \
            -x lintVital

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HTMLDebugger-Debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Build Summary
        if: always()
        run: |
          echo "=== Build Summary ==="
          if [ -d "app/build/outputs/apk/debug" ]; then
            echo "✅ APKs generated:"
            ls -lh app/build/outputs/apk/debug/*.apk || echo "No APK found"
          else
            echo "⚠️️ No APK output directory found"
          fi
