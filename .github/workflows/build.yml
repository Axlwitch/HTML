name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install Gradle 7.5
        run: |
          wget -q https://services.gradle.org/distributions/gradle-7.5-all.zip -O /tmp/gradle-7.5.zip
          unzip -q /tmp/gradle-7.5.zip -d /tmp
          echo "/tmp/gradle-7.5/bin" >> $GITHUB_PATH

      - name: Generate Gradle wrapper if missing
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 7.5
          fi

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Build APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs='-Xmx3072m -XX:MaxMetaspaceSize=512m'"
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HTMLDebugger-Debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Build Summary
        if: always()
        run: |
          echo "=== Build Summary ==="
          if [ -d "app/build/outputs/apk/debug" ]; then
            echo "✅ APK generated:"
            ls -lh app/build/outputs/apk/debug/*.apk || echo "No APK found"
          else
            echo "⚠️ No APK output directory found"
          fi
