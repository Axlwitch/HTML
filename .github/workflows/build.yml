name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-33
            build-tools;33.0.0

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || echo "gradlew not found, will use gradle directly"

      - name: Build Debug APK
        run: |
          echo "🔨 Build started at $(date '+%Y-%m-%d %H:%M:%S')"
          START_TIME=$(date +%s)

          if [ -f gradlew ]; then
            ./gradlew assembleDebug --stacktrace -x lint
          else
            gradle assembleDebug --stacktrace -x lint
          fi

          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          echo "✅ Build finished at $(date '+%Y-%m-%d %H:%M:%S')"
          echo "⏱️  Build duration: ${DURATION} seconds ($(($DURATION / 60)) minutes $(($DURATION % 60)) seconds)"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HTMLDebugger-Debug
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: List build output for debugging
        if: always()
        run: find . -name "*.apk" -type f 2>/dev/null || echo "No APK files found"
